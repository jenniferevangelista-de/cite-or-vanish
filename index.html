 <p class="fine">This page replays saved runs of Gemma 4 E4B (QAT) on ${N.n} bug-localization tasks. Nothing is computed live and no model is called. The cases are the first of each outcome group in id order, not chosen to flatter. The third check (the copied line must appear in the function's code) ran during the experiment; the source code is not bundled here, so the page shows its result instead of re-running it. The newer issues predate Gemma 4, so they test new repositories, not unseen data.</p>`)
};
function bar(l,v,c,label){return `<div class="bar">${l}<div><span style="background:${c}" data-w="${(v*100).toFixed(1)}"></span></div><b class="v">${label!=null?label:pc(v)}</b></div>`}

const AFTER={
open:async()=>{const box=document.getElementById('opendot');box.innerHTML=`<div style="width:170px">${document.getElementById('dot-svg').innerHTML}</div>`;mood('shock');
 await sleep(900);const r=document.getElementById('reveal');if(r)r.style.opacity=1},
rule:()=>say("I'm Dot. I hunt bugs, and the stories small models tell about them. My rule is simple: cite real code, or vanish.","happy"),
case:()=>say("Pick a file. Every answer in there is exactly what Gemma said, no edits.","happy"),
free:()=>say("Lots of confident names. Let me check if any of these functions are real.","scan"),
lineup:()=>say("Same bug. This time Gemma has to point at the list and copy a line as proof.","scan"),
verdict:()=>{const t=T();const hit=t.cite[0]&&t.cite[0].gold;setTimeout(()=>hit?SFX.bell():SFX.thud(),350);
 say(hit?"Case closed. The cited function is the one the maintainers fixed.":t.goldrank.length?"Not this time. The right one was on the list, but Gemma pointed elsewhere.":"Not this time. Search never put the right function on the list.",hit?'happy':'shock')},
numbers:async()=>{say("One case is a story. Here are all of them.","happy");await sleep(150);
 document.querySelectorAll('[data-w]').forEach(s=>s.style.width=s.dataset.w+'%');
 document.querySelectorAll('[data-to]').forEach(el=>count(el,+el.dataset.to,v=>pc(v)));
 document.querySelectorAll('[data-n]').forEach(el=>count(el,+el.dataset.n,v=>Math.round(v)))},
proof:()=>say("Everything here is a replay of saved runs. Go check the receipts.","happy")
};
async function count(el,to,f){const id=run;for(let i=0;i<=40;i++){if(id!==run)return;el.textContent=f(to*i/40);if(i%5==0)SFX.tick();await sleep(25)}}

async function checkFree(){const id=run,t=T();document.getElementById('fbtn').disabled=true;mood('scan');
 for(let i=0;i<t.free.length;i++){const c=document.getElementById('f'+i);c.classList.add('scan');SFX.tick();await sleep(650);if(id!==run)return;
  c.classList.remove('scan');c.querySelector('.stamp').classList.add('show');t.free[i].kept?SFX.ding():SFX.thud();await sleep(250);c.classList.add(t.free[i].kept?'stay':'gone');if(!t.free[i].kept)SFX.pop();await sleep(300)}
 const k=t.free.filter(x=>x.kept).length;
 document.getElementById('fsum').innerHTML=k?`<b>${t.free.length-k} of ${t.free.length}</b> names do not exist in the repository. ${k} survived.`:`<b>All ${t.free.length}</b> names are invented. An agent would have chased ${t.free.length} dead ends.`;
 say(k?"Some of those don't exist at all. An agent would waste turns on them.":"Not one of them exists. Pure fiction.",'shock')}

async function checkCite(){const id=run,t=T();document.getElementById('cbtn').disabled=true;mood('scan');
 const box=document.getElementById('checks');const sl=t.shortlist;
 for(const q of t.cite){const idx=sl.indexOf(q.resolved),isNum=/^\[?\d+\]?$/.test(q.raw);
  const rows=[
   [idx>=0,`On the shortlist: ${isNum?`list number <code>${esc(q.raw)}</code> → `:''}<code>${esc(q.resolved||q.raw)}</code>`],
   [!!q.resolved,`Exists in the code graph`],
   [!!q.evidence,`Copied line found in its source: <code>${esc(q.evidence)}</code>`]];
  for(const [ok,txt] of rows){const d=document.createElement('div');d.className='chk';d.innerHTML=`<span class="ic">${ok?'✅':'❌'}</span><span>${txt}</span>`;box.appendChild(d);d.scrollIntoView({block:'center',behavior:'smooth'});
   await sleep(420);if(id!==run)return;d.classList.add('on',ok?'ok':'bad');ok?SFX.ding():SFX.thud();
   if(txt.startsWith('On the')&&idx>=0){document.getElementById('s'+idx).classList.add('cited')}}
  await sleep(250)}
 const kept=t.cite.filter(q=>q.resolved).length;
 const p=document.createElement('p');p.className='note';p.innerHTML=`<b>${kept} of ${t.cite.length}</b> citations passed. Every location handed to the agent is real.`;box.appendChild(p);
 const n=document.createElement('button');n.className='go gold';n.textContent='See the verdict →';n.onclick=()=>go(5);box.appendChild(n);n.scrollIntoView({block:'center',behavior:'smooth'});
 say("Every citation points at real code, with proof. Now, was it the right one?",'happy')}

document.getElementById('next').onclick=()=>go(S+1);
document.getElementById('snd').onclick=()=>{setSnd(!SND);if(SND)SFX.ding()};setSnd(SND);
document.getElementById('prev').onclick=()=>go(S-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(S+1);if(e.key==='ArrowLeft')go(S-1)});
render();
</script></body></html>
