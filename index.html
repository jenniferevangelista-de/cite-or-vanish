let AC=null,SND=true;try{SND=localStorage.getItem('cv_snd')!=='0'}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,dur,vol=.05,delay=0){if(!SND)return;const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
 o.type='sine';o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const SFX={pop:()=>tone(560,180,.14,.05),ding:()=>{tone(988,null,.5,.035);tone(1480,null,.55,.018,.05)},
 bell:()=>{tone(784,null,.8,.045);tone(1175,null,.9,.03,.12);tone(1568,null,1,.022,.24)},low:()=>tone(330,220,.3,.04)};
let VO=null;
function stopVoice(){if(VO){VO.pause();VO=null}}
function setSnd(v){SND=v;if(!v)stopVoice();try{localStorage.setItem('cv_snd',v?'1':'0')}catch(e){}const b=document.getElementById('snd');b.textContent=v?L().son:L().soff;b.setAttribute('aria-pressed',v)}

/* ---------- Dot ---------- */
function stage(html){return `<div class="stage"><div class="dotbox">${document.getElementById('dot-svg').innerHTML}<div class="bubble" id="say"></div></div><div>${html}</div></div>`}
async function say(key,mood){
 const id=++run, el=document.getElementById('say'), dot=document.getElementById('dot');
 if(!el)return; dot.setAttribute('class',mood||'happy'); el.textContent='';
 const text=LINES[LANG][key], m=dot.querySelector('.mouth');
 stopVoice(); let dur=text.length*0.045;
 if(SND){const a=new Audio(`voice/${key}${LANG=='pt'?'_pt':''}.mp3`);VO=a;
  try{await a.play();if(isFinite(a.duration)&&a.duration>0)dur=a.duration}catch(e){VO=null}}
 const t0=performance.now();
 while(true){ if(id!==run)return; const f=Math.min(1,(performance.now()-t0)/1000/dur);
  el.textContent=text.slice(0,Math.ceil(text.length*f));
  m.style.transform=f<1?`scaleY(${1+Math.random()*1.8})`:''; if(f>=1)break; await sleep(70)}
}
function mood(m){const d=document.getElementById('dot');if(d)d.setAttribute('class',m)}

/* ---------- scenes ---------- */
const KEYS=['open','rule','case','free','lineup','verdict','numbers','proof'];
function go(i){S=Math.max(0,Math.min(KEYS.length-1,i));render();window.scrollTo({top:0,behavior:'smooth'})}
function setLang(l){LANG=l;try{localStorage.setItem('cv_lang',l)}catch(e){}document.documentElement.lang=l;
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang==l));
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=L()[e.dataset.t]);setSnd(SND);render()}
function render(){
 run++; stopVoice();
 const k=KEYS[S], l=L();
 document.getElementById('chips').innerHTML=l.scenes.map((s,i)=>`<button class="chip ${i==S?'on':''}" onclick="go(${i})">${s}</button>`).join('');
 document.getElementById('pos').textContent=`${l.scenes[S]} · ${S+1} ${l.of} ${KEYS.length}`;
 document.getElementById('prev').style.visibility=S?'visible':'hidden';
 const nx=document.getElementById('next'); nx.style.visibility=S<KEYS.length-1?'visible':'hidden'; nx.textContent=l.next[S];
 main.innerHTML=`<section class="scene">${VIEW[k]()}</section>`;
 (AFTER[k]||(()=>{}))();
 const chip=document.querySelector('.chip.on'); if(chip)chip.scrollIntoView({inline:'center',block:'nearest'});
}
const T=()=>D.tasks[cur];
const caseName=t=>`${t.repo.split('/')[1]} #${t.num}`;
function bar(lb,v,c,label){return `<div class="bar">${lb}<div><span style="background:${c}" data-w="${(v*100).toFixed(1)}"></span></div><b class="v">${label!=null?label:pc(v)}</b></div>`}

const VIEW={
open:()=>{const l=L();return `<h1 class="hero">${l.h1a} <span class="r">${X.free_claims||425}</span> ${l.h1b}</h1>
 <p class="hero-sub" id="reveal" style="opacity:0;transition:opacity 1s"><b style="font:italic 600 clamp(30px,4vw,44px)/1.1 var(--f-title);color:var(--red)">${pc(X.invented||.722)} ${l.h1c}</b></p>
 <div style="display:flex;justify-content:center;margin-top:10px" id="opendot"></div><span class="ghostline">${l.tag}</span>`},
rule:()=>{const l=L(),n=D.tasks[0].n_shortlist;return stage(`<div class="kicker">${l.k_rule}</div><h2 class="t">${l.t_rule}</h2><p class="lede">${l.l_rule}</p>
 <div class="grid3"><div class="card rule"><span class="n">${l.c1}</span><b>${l.c1b}</b><p>${l.c1p(n)}</p></div>
 <div class="card rule"><span class="n">${l.c2}</span><b>${l.c2b}</b><p>${l.c2p}</p></div>
 <div class="card rule"><span class="n">${l.c3}</span><b>${l.c3b}</b><p>${l.c3p}</p></div></div><p class="note">${l.rnote}</p>`)},
case:()=>{const l=L();return stage(`<div class="kicker">${l.k_case}</div><h2 class="t">${l.t_case}</h2><p class="lede">${l.l_case}</p>
 <div class="cases">${D.tasks.map((t,i)=>`<button class="case ${i==cur?'on':''}" onclick="cur=${i};go(3)"><span class="tab">${l.casen} ${i+1}</span><b>#${t.num}</b><span>${esc(t.repo)}</span></button>`).join('')}</div><p class="note">${l.cnote}</p>`)},
free:()=>{const l=L(),t=T();return stage(`<div class="kicker">${esc(caseName(t))} · ${l.k_free}</div><h2 class="t">${l.t_free}</h2><p class="lede">${l.l_free}</p>
 <div class="claims">${t.free.map((x,i)=>`<div class="claim" id="f${i}"><code>${esc(x.id)}</code><small>“${esc(x.reason)}”</small><span class="stamp ${x.kept?'ok':'bad'}">${x.kept?l.exists:l.nosuch}</span></div>`).join('')||`<p class="note">${l.noans}</p>`}</div>
 <button class="go" id="fbtn" onclick="checkFree()">${l.bfree}</button><p class="note" id="fsum"></p>`)},
lineup:()=>{const l=L(),t=T(),n=t.n_shortlist;return stage(`<div class="kicker">${esc(caseName(t))} · ${l.k_line}</div><h2 class="t">${l.t_line(n)}</h2><p class="lede">${l.l_line(n)}</p>
 <div class="lineup">${t.shortlist.map((x,i)=>`<div class="sus" id="s${i}"><i>${i+1}</i>${esc(x)}</div>`).join('')}</div>
 <div class="answer">${t.cite.length?t.cite.map(q=>`{ <span class="k">"id"</span>: <span class="s">"${esc(q.raw)}"</span>, <span class="k">"evidence"</span>: <span class="s">"${esc(q.evidence)}"</span> }`).join('<br>'):'('+l.noans+')'}</div>
 <button class="go" id="cbtn" onclick="checkCite()">${l.bcite}</button><div class="checks" id="checks"></div>`)},
verdict:()=>{const l=L(),t=T(),fk=t.free.filter(x=>x.kept),hit=t.cite[0]&&t.cite[0].gold,fhit=fk[0]&&fk[0].gold;
 return stage(`<div class="kicker">${esc(caseName(t))} · ${l.k_verd}</div><h2 class="t">${l.t_verd}</h2><p class="lede">${l.l_verd}</p>
 <div class="fix card">${l.changed} <code>${t.gold.map(esc).join(', ')}</code><br><a href="https://github.com/${esc(t.repo)}/issues/${esc(t.num)}" target="_blank" rel="noopener">${l.open} ${esc(t.repo)}#${esc(t.num)} ${l.ongh}</a></div>
 <div class="verdict" style="margin-top:14px">
  <div class="vcard ${fhit?'ok':'bad'}"><span class="lbl">${l.vfree}</span><b>${fk.length?(fhit?l.correct:l.wrong):l.none}</b><span class="note">${fk.length?'':l.allinv}</span></div>
  <div class="vcard ${hit?'ok':'bad'}"><span class="lbl">${l.vcite}</span><b>${t.cite.length?(hit?l.correct:l.wrong):l.none}</b><span class="note">${t.goldrank.length?l.wasat(t.goldrank.join(', #')):l.notlist}</span></div></div>
 <button class="go gold" onclick="cur=(cur+1)%D.tasks.length;go(3)">${l.nextcase}</button>`)},
numbers:()=>{const l=L();return stage(`<div class="kicker">${l.k_num}</div><h2 class="t">${l.t_num}</h2><p class="lede">${l.l_num}</p>
 <div class="stats">
  <div class="stat"><div class="big"><span class="a">${pc(N.free_hit1)} →</span> <span data-to="${N.cite_hit1}">0%</span></div><p>${l.s1(N.n)}</p>
   <div class="bars">${bar(l.bfree2,N.free_hit1,'var(--bad)')}${bar(l.bsearch,N.retr_hit1,'var(--mut)')}${bar(l.bcv,N.cite_hit1,'var(--ok)')}</div></div>
  <div class="stat"><div class="big"><span class="a">${pc(X.live_retr)} →</span> <span data-to="${X.live_cite}">0%</span></div><p>${l.s2(X.live_tasks,X.live_repos)}</p>
   <div class="bars">${bar(l.bfree2,X.live_free,'var(--bad)')}${bar(l.bsearch,X.live_retr,'var(--mut)')}${bar(l.bcv,X.live_cite,'var(--ok)')}</div></div>
  <div class="stat"><div class="big"><span class="a">${N.agent_base} →</span> <span data-n="${N.agent_ours}">0</span></div><p>${l.s3(N.agent_tasks)}</p>
   <div class="bars">${bar(l.bagent,N.agent_base/N.agent_tasks,'var(--mut)',N.agent_base)}${bar(l.brule,N.agent_ours/N.agent_tasks,'var(--gold)',N.agent_ours)}</div></div></div>`)},
proof:()=>{const l=L();return stage(`<div class="kicker">${l.k_proof}</div><h2 class="t">${l.t_proof}</h2>
 <div class="links"><a class="card" href="https://www.kaggle.com/competitions/gemma-4-developer-agent-paper" target="_blank" rel="noopener"><b>${l.p1}</b><span>${l.p1s}</span></a>
  <a class="card" href="https://github.com/jenniferevangelista-de/cite-or-vanish" target="_blank" rel="noopener"><b>${l.p2}</b><span>${l.p2s}</span></a>
  <a class="card" href="https://huggingface.co/datasets/SWE-bench-Live/SWE-bench-Live" target="_blank" rel="noopener"><b>${l.p3}</b><span>${l.p3s}</span></a></div>
 <p class="fine">${l.fine(N.n)}</p>`)}
};

const AFTER={
open:async()=>{const box=document.getElementById('opendot');box.innerHTML=`<div style="width:170px">${document.getElementById('dot-svg').innerHTML}</div>`;mood('shock');
 await sleep(900);const r=document.getElementById('reveal');if(r)r.style.opacity=1},
rule:()=>say('rule','happy'),case:()=>say('case','happy'),free:()=>say('free','scan'),lineup:()=>say('lineup','scan'),
verdict:()=>{const t=T(),hit=t.cite[0]&&t.cite[0].gold;setTimeout(()=>hit?SFX.bell():SFX.low(),300);
 say(hit?'verdict_hit':t.goldrank.length?'verdict_wrong':'verdict_miss',hit?'happy':'shock')},
numbers:async()=>{say('numbers','happy');await sleep(150);
 document.querySelectorAll('[data-w]').forEach(s=>s.style.width=s.dataset.w+'%');
 document.querySelectorAll('[data-to]').forEach(el=>count(el,+el.dataset.to,v=>pc(v)));
 document.querySelectorAll('[data-n]').forEach(el=>count(el,+el.dataset.n,v=>Math.round(v)))},
proof:()=>say('proof','happy')};
async function count(el,to,f){const id=run;for(let i=0;i<=40;i++){if(id!==run)return;el.textContent=f(to*i/40);await sleep(25)}}

async function checkFree(){const id=run,t=T(),l=L();document.getElementById('fbtn').disabled=true;mood('scan');
 for(let i=0;i<t.free.length;i++){const c=document.getElementById('f'+i);c.classList.add('scan');await sleep(650);if(id!==run)return;
  c.classList.remove('scan');c.querySelector('.stamp').classList.add('show');await sleep(250);c.classList.add(t.free[i].kept?'stay':'gone');t.free[i].kept?SFX.ding():SFX.pop();await sleep(300)}
 const k=t.free.filter(x=>x.kept).length;
 document.getElementById('fsum').innerHTML=k?l.fsome(t.free.length-k,t.free.length,k):l.fnone(t.free.length);
 say(k?'free_some':'free_none','shock')}

async function checkCite(){const id=run,t=T(),l=L();document.getElementById('cbtn').disabled=true;mood('scan');
 const box=document.getElementById('checks'),sl=t.shortlist;
 for(const q of t.cite){const idx=sl.indexOf(q.resolved),isNum=/^\[?\d+\]?$/.test(q.raw);
  const rows=[[idx>=0,`${l.ch1}: ${isNum?`${l.lnum} <code>${esc(q.raw)}</code> → `:''}<code>${esc(q.resolved||q.raw)}</code>`,idx],
   [!!q.resolved,l.ch2],[!!q.evidence,`${l.ch3}: <code>${esc(q.evidence)}</code>`]];
  for(const [ok,txt,ix] of rows){const d=document.createElement('div');d.className='chk';d.innerHTML=`<span class="ic">${ok?'✅':'❌'}</span><span>${txt}</span>`;box.appendChild(d);d.scrollIntoView({block:'center',behavior:'smooth'});
   await sleep(420);if(id!==run)return;d.classList.add('on',ok?'ok':'bad');ok?SFX.ding():SFX.low();
   if(ix!=null&&ix>=0)document.getElementById('s'+ix).classList.add('cited')}
  await sleep(250)}
 const kept=t.cite.filter(q=>q.resolved).length;
 const p=document.createElement('p');p.className='note';p.innerHTML=l.cdone(kept,t.cite.length);box.appendChild(p);
 const n=document.createElement('button');n.className='go gold';n.textContent=l.bverd;n.onclick=()=>go(5);box.appendChild(n);n.scrollIntoView({block:'center',behavior:'smooth'});
 say('cite_done','happy')}

document.getElementById('next').onclick=()=>go(S+1);
document.getElementById('prev').onclick=()=>go(S-1);
document.getElementById('snd').onclick=()=>setSnd(!SND);
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(S+1);if(e.key==='ArrowLeft')go(S-1)});
setLang(LANG);
</script></body></html>
